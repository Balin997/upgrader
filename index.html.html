<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Апгрейдер скинов CS2 — полный каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  tailwind.config = { theme: { extend: {

<style>
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark; }
  html { scroll-padding-top: env(safe-area-inset-top,0px); }
  body { background: radial-gradient(1100px 620px at 50% -12%, #1c2436 0%, rgba(8,9,13,0) 62%), #08090d; color:#e7eaf2; }
  .clip-panel { clip-path: polygon(0 14px, 14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
  .clip-btn { clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .grain::before { content:""; position:absolute; inset:0; pointer-events:none; background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); mix-blend-mode:overlay; }
  .needle { transition: transform 4.6s cubic-bezier(.13,.76,.17,1); }
  .needle-idle { transition: transform .35s ease-out; }
  @keyframes popIn { from{transform:scale(.92);opacity:0} to{transform:scale(1);opacity:1} }
  .pop-in { animation: popIn .28s ease-out both; }
  @keyframes shimmer { 0%{background-position:-380px 0} 100%{background-position:380px 0} }
  .skeleton { background:linear-gradient(90deg,#141824 0%,#1d2231 50%,#141824 100%); background-size:380px 100%; animation:shimmer 1.3s linear infinite; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#262c3d; }
  ::-webkit-scrollbar-track { background:#0d1017; }
  button:focus-visible, input:focus-visible { outline:2px solid #d8b45c; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { .needle{transition-duration:.4s} .skeleton{animation:none} }
</style>
</head>
<body class="font-body antialiased">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useRef, useEffect, useCallback } = React;

/* =========================================================
   1. ИСТОЧНИКИ ДАННЫХ
   ========================================================= */

// Каталог: все скины на всё оружие (~1800 записей, сгруппированы по износам).
const CATALOG_URLS = [
  'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json',
  'https://bymykel.github.io/CSGO-API/api/en/skins.json',
];

// Цены: открытый прайс-лист маркета, ключ не нужен. Ключ сопоставления —
// market_hash_name вида "AK-47 | Redline (Field-Tested)".
const PRICE_URL = 'https://market.csgo.com/api/v2/prices/USD.json';

const WEAR_SHORT = {
  'Factory New':'FN', 'Minimal Wear':'MW', 'Field-Tested':'FT',
  'Well-Worn':'WW', 'Battle-Scarred':'BS',
};

// Разделы по типу оружия — по ним фильтруется каталог в окне выбора.
const GROUPS = [
  { id:'all',    label:'Все' },
  { id:'knife',  label:'Ножи' },
  { id:'gloves', label:'Перчатки' },
  { id:'rifle',  label:'Винтовки' },
  { id:'sniper', label:'Снайперские' },
  { id:'smg',    label:'Пистолеты-пулемёты' },
  { id:'heavy',  label:'Тяжёлое' },
  { id:'pistol', label:'Пистолеты' },
];

function groupOf(item) {
  const cat = (item.category?.id || '').toLowerCase();
  const w = (item.weapon?.id || '').toLowerCase();
  if (cat.includes('knives') || /knife|bayonet/.test(w)) return 'knife';
  if (cat.includes('gloves') || /glove|wraps/.test(w)) return 'gloves';
  if (/awp|ssg08|scar20|g3sg1/.test(w)) return 'sniper';
  if (/nova|xm1014|mag7|sawedoff|m249|negev/.test(w)) return 'heavy';
  if (/mp9|mp7|mp5sd|mac10|ump45|p90|bizon/.test(w)) return 'smg';
  if (/deagle|revolver|glock|usp|hkp2000|p250|fiveseven|tec9|cz75|elite/.test(w)) return 'pistol';
  return 'rifle';
}

/* --- цены --- */

const PRICE_BANDS = {
  rarity_rare_weapon:      [10, 45],
  rarity_mythical_weapon:  [40, 110],
  rarity_legendary_weapon: [100, 220],
  rarity_ancient_weapon:   [200, 380],
  rarity_contraband:       [350, 500],
  rarity_ancient:          [350, 500],
};

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) / 4294967295;
}

// Тестовая цена 10…500 $, детерминированная: при перезагрузке не меняется.
function testPrice(key, rarityId) {
  const [lo, hi] = PRICE_BANDS[rarityId] || [10, 500];
  return Math.round((lo + hashString(key) * (hi - lo)) * 100) / 100;
}

async function fetchJSON(urls, signal) {
  let last;
  for (const url of [].concat(urls)) {
    try {
      const res = await fetch(url, { signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) { if (e.name === 'AbortError') throw e; last = e; }
  }
  throw last;
}

// Прайс-лист → Map<market_hash_name, price>. Недоступность цен не ломает игру.
async function fetchPrices(signal) {
  try {
    const data = await fetchJSON(PRICE_URL, signal);
    const rows = Array.isArray(data) ? data : (data.items || []);
    const map = new Map();
    for (const r of rows) {
      const p = parseFloat(r.price);
      if (r.market_hash_name && isFinite(p) && p > 0) map.set(r.market_hash_name, p);
    }
    return map;
  } catch (e) {
    return new Map();
  }
}

/* Разворачиваем каталог: каждый скин × каждый доступный износ.
   Получаем полный список торгуемых позиций со своей ценой у каждой. */
function buildCatalog(raw, priceMap) {
  const out = [];
  const list = Array.isArray(raw) ? raw : Object.values(raw);

  for (const item of list) {
    if (!item || !item.name) continue;
    const wears = (item.wears && item.wears.length) ? item.wears : [{ name: null }];
    const grp = groupOf(item);

    for (const wear of wears) {
      const hashName = wear.name ? `${item.name} (${wear.name})` : item.name;
      const real = priceMap.get(hashName);
      out.push({
        id: item.id + (wear.name ? '|' + (WEAR_SHORT[wear.name] || wear.name) : ''),
        hashName,
        name: item.name,
        image: item.image || null,
        wear: wear.name || 'Без износа',
        wearShort: WEAR_SHORT[wear.name] || '',
        group: grp,
        weapon: item.weapon?.name || '',
        rarityColor: item.rarity?.color || '#4b69ff',
        rarityName: item.rarity?.name || '',
        price: real != null ? Math.round(real * 100) / 100 : testPrice(hashName, item.rarity?.id),
        realPrice: real != null,
      });
    }
  }
  out.sort((a, b) => a.price - b.price);
  return out;
}

/* Аварийный набор на случай, когда сеть или CORS недоступны. */
const OFFLINE = [
  ['P250 | Sand Dune','pistol','rarity_rare_weapon','Field-Tested','#4b69ff'],
  ['MP9 | Deadly Poison','smg','rarity_rare_weapon','Minimal Wear','#4b69ff'],
  ['Galil AR | Chromatic Aberration','rifle','rarity_rare_weapon','Well-Worn','#4b69ff'],
  ['Nova | Bloomstick','heavy','rarity_mythical_weapon','Field-Tested','#8847ff'],
  ['USP-S | Cortex','pistol','rarity_mythical_weapon','Minimal Wear','#8847ff'],
  ['AK-47 | Redline','rifle','rarity_legendary_weapon','Field-Tested','#d32ce6'],
  ['M4A1-S | Golden Coil','rifle','rarity_legendary_weapon','Minimal Wear','#d32ce6'],
  ['Desert Eagle | Blaze','pistol','rarity_ancient_weapon','Factory New','#eb4b4b'],
  ['AWP | Asiimov','sniper','rarity_ancient_weapon','Field-Tested','#eb4b4b'],
  ['Sport Gloves | Vice','gloves','rarity_ancient','Well-Worn','#ffd700'],
  ['Karambit | Doppler','knife','rarity_ancient','Minimal Wear','#ffd700'],
  ['M4A4 | Howl','rifle','rarity_contraband','Factory New','#e4ae39'],
].map(([name, group, rid, wear, color], i) => ({
  id: 'offline-' + i, hashName: `${name} (${wear})`, name, image: null,
  wear, wearShort: WEAR_SHORT[wear] || '', group, weapon: name.split(' | ')[0],
  rarityColor: color, rarityName: '', price: testPrice(name + wear, rid), realPrice: false,
})).sort((a, b) => a.price - b.price);

/* =========================================================
   2. Экономика
   ========================================================= */

const HOUSE = 0.92;
const money = (v) => '$' + Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
const chanceFor = (src, dst) => (!src || !dst) ? 0
  : Math.max(1, Math.min(92, Math.round((src.price / dst.price) * 100 * HOUSE * 10) / 10));

/* =========================================================
   3. Графика
   ========================================================= */

const SHAPES = {
  rifle: <g><path d="M14 58 h96 v-9 h-22 v-8 h-30 l-6 8 h-24 v-9 h-14 z" /><path d="M110 49 h52 v7 h-52 z" /><path d="M60 58 l6 22 h14 l-4 -22 z" /><path d="M14 58 h18 l12 20 h-22 z" /></g>,
  sniper: <g><path d="M10 60 h100 v-8 h-26 v-7 h-34 l-6 7 h-20 v-8 h-14 z" /><path d="M110 52 h56 v6 h-56 z" /><rect x="58" y="34" width="44" height="7" rx="3" /><path d="M56 60 l5 22 h14 l-4 -22 z" /></g>,
  smg: <g><path d="M22 56 h74 v-10 h-18 v-7 h-38 l-5 7 h-13 z" /><path d="M96 47 h34 v7 h-34 z" /><path d="M52 56 l4 24 h14 l-3 -24 z" /><path d="M22 56 h16 l9 18 h-19 z" /></g>,
  heavy: <g><path d="M16 60 h104 v-14 h-30 v-6 h-44 l-6 6 h-24 z" /><path d="M120 48 h40 v9 h-40 z" /><path d="M58 60 l5 24 h16 l-4 -24 z" /></g>,
  pistol: <g><path d="M40 46 h84 v14 h-30 l-4 6 h-50 z" /><path d="M56 66 l-10 28 h20 l10 -28 z" /><rect x="102" y="60" width="9" height="16" rx="2" /></g>,
  knife: <g><path d="M24 74 c26 -34 62 -52 104 -56 c-6 26 -30 52 -66 62 z" /><path d="M24 74 l-14 8 l10 12 l16 -12 z" /></g>,
  gloves: <g><path d="M40 92 c-8 -18 -6 -44 4 -56 c6 -8 16 -6 17 4 l2 20 l3 -30 c1 -10 14 -10 15 0 l1 28 l5 -24 c2 -10 15 -8 14 2 l-3 26 l7 -14 c4 -9 16 -4 13 6 l-10 34 c-4 12 -12 16 -24 16 h-22 c-9 0 -16 -4 -22 -12 z" /></g>,
};

function VectorSkin({ skin, size }) {
  const col = skin.rarityColor;
  const gid = 'g-' + String(skin.id).replace(/[^a-z0-9]/gi, '');
  const shape = SHAPES[skin.group] || SHAPES.rifle;
  return (
    <svg viewBox="0 0 170 110" width={size} height={size * 110 / 170} className="max-w-full drop-shadow-[0_8px_18px_rgba(0,0,0,.6)]">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={col} stopOpacity=".95" />
          <stop offset="48%" stopColor="#e9edf7" stopOpacity=".92" />
          <stop offset="100%" stopColor={col} stopOpacity=".8" />
        </linearGradient>
      </defs>
      <g fill={`url(#${gid})`}>{shape}</g>
    </svg>
  );
}

function SkinArt({ skin, size = 190 }) {
  const [broken, setBroken] = useState(false);
  useEffect(() => setBroken(false), [skin && skin.id]);
  if (!skin) return null;
  if (!skin.image || broken) return <VectorSkin skin={skin} size={size} />;
  return <img src={skin.image} alt={skin.name} loading="lazy" onError={() => setBroken(true)}
    style={{ width: size, maxWidth: '100%' }} className="object-contain drop-shadow-[0_10px_22px_rgba(0,0,0,.65)]" />;
}

/* =========================================================
   4. Интерфейс
   ========================================================= */

function SkinPanel({ skin, side, onPick, disabled, loading }) {
  const col = skin ? skin.rarityColor : '#3a4256';
  return (
    <div className="clip-panel grain relative bg-plate/90 border border-edge p-5 flex flex-col h-full"
      style={{ boxShadow: `inset 0 0 0 1px rgba(255,255,255,.03), 0 0 46px -26px ${col}` }}>
      <div className="flex items-baseline justify-between gap-2">
        <span className="font-head text-[13px] text-ash">{side}</span>
        {skin && <span className="text-[11px] text-ash/70">{skin.rarityName}</span>}
      </div>
      <div className="h-1 w-full mt-3" style={{ background: `linear-gradient(90deg, ${col}, transparent)` }} />
      <div className="flex-1 grid place-items-center py-6 min-h-[160px]">
        {loading ? <div className="skeleton w-40 h-24" /> : skin ? <SkinArt skin={skin} /> : <span className="text-ash/50 text-sm">Выбери скин</span>}
      </div>
      {loading ? (
        <div className="space-y-2"><div className="skeleton h-4 w-3/4" /><div className="skeleton h-3 w-1/3" /><div className="skeleton h-6 w-1/2" /></div>
      ) : skin ? (
        <div>
          <h3 className="font-head text-lg leading-tight" style={{ color: col }}>{skin.name}</h3>
          <p className="text-xs text-ash mt-0.5">{skin.wear}{!skin.realPrice && <span className="text-ash/60"> · цена тестовая</span>}</p>
          <p className="font-head text-2xl mt-2 text-white">{money(skin.price)}</p>
        </div>
      ) : null}
      {onPick && <button onClick={onPick} disabled={disabled}
        className="clip-btn mt-4 py-2 bg-steel border border-edge text-sm text-ash hover:text-white hover:border-sand/60 disabled:opacity-40 transition-colors">
        Сменить скин</button>}
    </div>
  );
}

function Wheel({ chance, angle, spinning, result }) {
  const R = 86, C = 2 * Math.PI * R, winLen = (chance / 100) * C;
  const ring = result === 'win' ? '#43d17c' : result === 'lose' ? '#eb4b4b' : '#2b3244';
  return (
    <div className="relative w-[228px] h-[228px] select-none">
      <svg viewBox="0 0 220 220" className="w-full h-full -rotate-90">
        <circle cx="110" cy="110" r={R} fill="none" stroke="#1b2130" strokeWidth="20" />
        <circle cx="110" cy="110" r={R} fill="none" stroke="#e0433f" strokeWidth="20" strokeOpacity=".55" />
        <circle cx="110" cy="110" r={R} fill="none" stroke="#43d17c" strokeWidth="20"
          strokeDasharray={`${winLen} ${C - winLen}`} style={{ transition:'stroke-dasharray .45s ease-out' }} />
        <circle cx="110" cy="110" r="66" fill="#0b0e15" stroke={ring} strokeWidth="2" style={{ transition:'stroke .3s' }} />
      </svg>
      <div className={`absolute inset-0 grid place-items-start justify-center ${spinning ? 'needle' : 'needle-idle'}`}
        style={{ transform: `rotate(${angle}deg)` }}>
        <div className="w-0 h-0 mt-[6px]" style={{ borderLeft:'9px solid transparent', borderRight:'9px solid transparent', borderTop:'22px solid #d8b45c' }} />
      </div>
      <div className="absolute inset-0 grid place-items-center pointer-events-none">
        <div className="text-center">
          <div className="font-head text-4xl text-white tabular-nums">{chance ? chance.toFixed(1) : '0.0'}<span className="text-xl text-ash">%</span></div>
          <div className="text-[11px] text-ash mt-1">шанс успеха</div>
        </div>
      </div>
    </div>
  );
}

const PAGE = 60;

function Picker({ title, hint, items, currentId, onSelect, onClose, showFilters }) {
  const [q, setQ] = useState('');
  const [grp, setGrp] = useState('all');
  const [shown, setShown] = useState(PAGE);

  const list = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return items.filter((s) =>
      (grp === 'all' || s.group === grp) &&
      (!needle || s.name.toLowerCase().includes(needle) || s.wear.toLowerCase().includes(needle))
    );
  }, [items, q, grp]);

  useEffect(() => setShown(PAGE), [q, grp]);

  return (
    <div className="fixed inset-0 z-40 bg-void/85 backdrop-blur-sm grid place-items-center p-4" onClick={onClose}>
      <div className="clip-panel bg-steel border border-edge w-full max-w-5xl max-h-[86vh] overflow-y-auto p-5 pop-in" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between gap-4">
          <div>
            <h2 className="font-head text-xl">{title}</h2>
            <p className="text-xs text-ash mt-1">{hint} · найдено {list.length}</p>
          </div>
          <button onClick={onClose} className="text-ash hover:text-white text-2xl leading-none px-2">×</button>
        </div>

        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Поиск: AWP, Dragon Lore, Factory New…"
          className="mt-4 w-full bg-plate border border-edge px-3 py-2 text-sm placeholder:text-ash/60 focus:border-sand/60 outline-none" />

        {showFilters && (
          <div className="flex flex-wrap gap-2 mt-3">
            {GROUPS.map((g) => (
              <button key={g.id} onClick={() => setGrp(g.id)}
                className="clip-btn px-3 py-1.5 text-xs border transition-colors"
                style={{ borderColor: grp === g.id ? '#d8b45c' : '#262c3d', color: grp === g.id ? '#d8b45c' : '#8b93a7', background:'#171b26' }}>
                {g.label}
              </button>
            ))}
          </div>
        )}

        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 mt-4">
          {list.length === 0 && <p className="text-sm text-ash col-span-full py-6">Ничего не нашлось. Попробуй другое слово или раздел.</p>}
          {list.slice(0, shown).map((s) => (
            <button key={s.id} onClick={() => onSelect(s.id)}
              className="clip-panel bg-plate border p-3 text-left hover:-translate-y-0.5 transition-transform"
              style={{ borderColor: s.id === currentId ? s.rarityColor : '#262c3d' }}>
              <div className="flex items-center justify-between">
                <div className="h-[3px] w-10" style={{ background: s.rarityColor }} />
                {s.wearShort && <span className="text-[10px] text-ash">{s.wearShort}</span>}
              </div>
              <div className="grid place-items-center h-16 mt-2"><SkinArt skin={s} size={118} /></div>
              <div className="text-[12px] mt-2 leading-tight text-white/90 line-clamp-2">{s.name}</div>
              <div className="font-head text-sm mt-1" style={{ color: s.rarityColor }}>{money(s.price)}</div>
            </button>
          ))}
        </div>

        {shown < list.length && (
          <button onClick={() => setShown((n) => n + PAGE)}
            className="clip-btn mt-4 w-full py-3 bg-plate border border-edge text-sm text-ash hover:text-white hover:border-sand/60 transition-colors">
            Показать ещё {Math.min(PAGE, list.length - shown)} из {list.length - shown}
          </button>
        )}
      </div>
    </div>
  );
}

/* =========================================================
   5. Приложение
   ========================================================= */

const KEY = 'cs2-upgrader-full-v1';

function App() {
  const [skins, setSkins] = useState([]);
  const [status, setStatus] = useState('loading');   // loading | api | offline
  const [priced, setPriced] = useState(false);       // подтянулись ли реальные цены
  const [errText, setErrText] = useState('');
  const [inventory, setInventory] = useState([]);
  const [srcId, setSrcId] = useState(null);
  const [dstId, setDstId] = useState(null);
  const [angle, setAngle] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [result, setResult] = useState(null);
  const [flash, setFlash] = useState(null);
  const [picker, setPicker] = useState(null);
  const [log, setLog] = useState([]);
  const [stats, setStats] = useState({ tries: 0, wins: 0, pnl: 0 });
  const timers = useRef([]);

  const byId = useCallback((id) => skins.find((s) => s.id === id) || null, [skins]);

  const boot = useCallback((list, mode) => {
    setSkins(list); setStatus(mode);
    // стартовый инвентарь: четыре недорогие позиции из разных ценовых ступеней
    const cheap = list.filter((s) => s.price >= 5);
    const starters = [0, 0.05, 0.1, 0.16].map((k) => cheap[Math.floor(cheap.length * k)]).filter(Boolean).map((s) => s.id);
    let inv = starters, src = starters[0];
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (saved && saved.mode === mode && Array.isArray(saved.inventory)) {
        const valid = saved.inventory.filter((id) => list.some((s) => s.id === id));
        if (valid.length) { inv = valid; src = valid[0]; }
        if (saved.stats) setStats(saved.stats);
      }
    } catch (e) {}
    setInventory(inv); setSrcId(src);
    const first = list.find((s) => s.id === src);
    const target = first ? (list.find((s) => s.price > first.price * 3) || list[list.length - 1]) : list[list.length - 1];
    setDstId(target ? target.id : null);
  }, []);

  const load = useCallback(() => {
    const ctrl = new AbortController();
    setStatus('loading'); setErrText('');
    Promise.all([fetchJSON(CATALOG_URLS, ctrl.signal), fetchPrices(ctrl.signal)])
      .then(([raw, priceMap]) => {
        const list = buildCatalog(raw, priceMap);
        if (!list.length) throw new Error('пустой каталог');
        setPriced(priceMap.size > 0);
        boot(list, 'api');
      })
      .catch((e) => {
        if (e.name === 'AbortError') return;
        setErrText(e.message || 'сеть недоступна');
        setPriced(false);
        boot(OFFLINE, 'offline');
      });
    return () => ctrl.abort();
  }, [boot]);

  useEffect(() => { const stop = load(); return () => { stop && stop(); timers.current.forEach(clearTimeout); }; }, [load]);

  useEffect(() => {
    if (status === 'loading') return;
    try { localStorage.setItem(KEY, JSON.stringify({ mode: status, inventory, stats })); } catch (e) {}
  }, [inventory, stats, status]);

  const src = byId(srcId), dst = byId(dstId);
  const chance = useMemo(() => chanceFor(src, dst), [src, dst]);
  const multi = src && dst ? dst.price / src.price : 0;
  const invSkins = inventory.map(byId).filter(Boolean);
  const targets = useMemo(() => skins.filter((s) => !src || s.price > src.price), [skins, src]);
  const barColor = chance >= 55 ? '#43d17c' : chance >= 22 ? '#d8b45c' : '#eb4b4b';
  const invValue = invSkins.reduce((a, s) => a + s.price, 0);
  const loading = status === 'loading';

  function upgrade() {
    if (!src || !dst || spinning) return;
    setSpinning(true); setResult(null); setFlash(null);
    const win = Math.random() * 100 < chance;
    const winArc = chance * 3.6;
    const land = win ? 3 + Math.random() * Math.max(1, winArc - 6)
                     : winArc + 3 + Math.random() * Math.max(1, 360 - winArc - 6);
    setAngle(Math.ceil(angle / 360) * 360 + 360 * 6 + land);
    timers.current.push(setTimeout(() => {
      setSpinning(false); setResult(win ? 'win' : 'lose'); setFlash({ win, from: src, to: dst });
      setInventory((inv) => { const i = inv.indexOf(src.id); const n = inv.slice(); if (i >= 0) n.splice(i, 1); if (win) n.push(dst.id); return n; });
      setStats((s) => ({ tries: s.tries + 1, wins: s.wins + (win ? 1 : 0), pnl: s.pnl + (win ? dst.price - src.price : -src.price) }));
      setLog((l) => [{ win, from: src.name, to: dst.name, chance, id: Date.now() }, ...l].slice(0, 6));
      setSrcId(win ? dst.id : null);
    }, 4700));
  }

  function resetAll() {
    timers.current.forEach(clearTimeout);
    setStats({ tries: 0, wins: 0, pnl: 0 }); setLog([]);
    setResult(null); setFlash(null); setSpinning(false); setAngle(0);
    try { localStorage.removeItem(KEY); } catch (e) {}
    boot(skins, status);
  }

  return (
    <div className="min-h-full">
      <header className="border-b border-edge/70 bg-void/70 backdrop-blur sticky top-0 z-20" style={{ paddingTop:'env(safe-area-inset-top, 0px)' }}>
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
          <div className="flex items-baseline gap-3">
            <span className="font-head font-extrabold text-xl tracking-tight">АПГРЕЙДЕР</span>
            <span className="text-[11px] text-ash hidden sm:inline">
              {loading ? 'грузим каталог…'
                : status === 'api' ? `${skins.length.toLocaleString('ru-RU')} позиций · цены ${priced ? 'с маркета' : 'тестовые'}`
                : 'встроенный набор'}
            </span>
          </div>
          <div className="flex items-center gap-5 text-right">
            <div><div className="text-[10px] text-ash">Инвентарь</div><div className="font-head text-sand">{money(invValue)}</div></div>
            <div><div className="text-[10px] text-ash">Успешных</div><div className="font-head">{stats.wins}<span className="text-ash">/{stats.tries}</span></div></div>
            <div><div className="text-[10px] text-ash">Итог</div>
              <div className="font-head tabular-nums" style={{ color: stats.pnl >= 0 ? '#43d17c' : '#eb4b4b' }}>{stats.pnl >= 0 ? '+' : '−'}{money(Math.abs(stats.pnl))}</div>
            </div>
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-6">
        {status === 'offline' && (
          <div className="clip-panel border border-edge bg-plate/70 px-4 py-3 mb-5 flex flex-wrap items-center gap-3 text-sm">
            <span className="w-1.5 h-5" style={{ background:'#d8b45c' }} />
            <span>Каталог не загрузился ({errText}). Играем на встроенном наборе из {OFFLINE.length} скинов.</span>
            <button onClick={load} className="clip-btn ml-auto px-4 py-1.5 bg-steel border border-edge text-ash hover:text-white hover:border-sand/60 transition-colors">Повторить</button>
          </div>
        )}

        <div className="grid lg:grid-cols-[1fr_auto_1fr] gap-5 items-stretch">
          <SkinPanel skin={src} side="Твой скин" loading={loading} onPick={() => setPicker('src')} disabled={loading || spinning || invSkins.length === 0} />

          <div className="flex flex-col items-center justify-center gap-5 lg:w-[300px] py-2">
            <Wheel chance={chance} angle={angle} spinning={spinning} result={result} />
            <div className="w-full">
              <div className="flex justify-between text-[11px] text-ash mb-1">
                <span>1%</span><span className="text-white/80">множитель ×{multi ? multi.toFixed(2) : '—'}</span><span>92%</span>
              </div>
              <div className="h-3 w-full bg-plate border border-edge overflow-hidden">
                <div className="h-full transition-[width] duration-500 ease-out"
                  style={{ width:`${chance}%`, background:`linear-gradient(90deg, ${barColor}55, ${barColor})`, boxShadow:`0 0 18px -2px ${barColor}` }} />
              </div>
            </div>
            <button onClick={upgrade} disabled={loading || !src || !dst || spinning}
              className="clip-btn w-full py-4 font-head font-extrabold text-lg text-void bg-sand hover:brightness-110 active:translate-y-px disabled:bg-edge disabled:text-ash transition"
              style={!spinning && !loading && src && dst ? { boxShadow:'0 0 34px -10px #d8b45c' } : {}}>
              {loading ? 'Загрузка…' : spinning ? 'Крутим…' : 'Апгрейд'}
            </button>
            <p className="text-[11px] text-ash text-center">При неудаче скин слева сгорает. Комиссия площадки — 8%.</p>
          </div>

          <SkinPanel skin={dst} side="Цель апгрейда" loading={loading} onPick={() => setPicker('dst')} disabled={loading || spinning} />
        </div>

        <section className="mt-8">
          <div className="flex items-center justify-between">
            <h2 className="font-head text-sm text-ash">Последние попытки</h2>
            <button onClick={resetAll} className="text-[11px] text-ash hover:text-sand transition-colors">Начать заново</button>
          </div>
          <div className="mt-3 grid gap-2">
            {log.length === 0 && <div className="clip-panel bg-plate/60 border border-edge px-4 py-3 text-sm text-ash">Пока пусто. Открой цель и выбери раздел — там всё оружие игры.</div>}
            {log.map((e) => (
              <div key={e.id} className="clip-panel bg-plate/70 border border-edge px-4 py-2.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
                <span className="w-1.5 h-5" style={{ background: e.win ? '#43d17c' : '#eb4b4b' }} />
                <span className="text-ash">{e.from}</span><span className="text-ash/50">→</span><span className="text-white/90">{e.to}</span>
                <span className="ml-auto text-xs text-ash tabular-nums">{e.chance.toFixed(1)}%</span>
                <span className="font-head text-xs" style={{ color: e.win ? '#43d17c' : '#eb4b4b' }}>{e.win ? 'получен' : 'сгорел'}</span>
              </div>
            ))}
          </div>
        </section>

        <section className="mt-6 mb-10">
          <h2 className="font-head text-sm text-ash mb-3">Инвентарь · {invSkins.length} шт.</h2>
          <div className="flex gap-2 overflow-x-auto pb-2">
            {loading && [0,1,2,3].map((i) => <div key={i} className="skeleton shrink-0 w-36 h-28" />)}
            {!loading && invSkins.length === 0 && <span className="text-sm text-ash">Всё сгорело. Нажми «Начать заново».</span>}
            {invSkins.map((s, i) => (
              <button key={s.id + '-' + i} onClick={() => !spinning && setSrcId(s.id)}
                className="clip-panel shrink-0 w-36 bg-plate border p-2 text-left hover:-translate-y-0.5 transition-transform"
                style={{ borderColor: s.id === srcId ? s.rarityColor : '#262c3d' }}>
                <div className="grid place-items-center h-14"><SkinArt skin={s} size={104} /></div>
                <div className="text-[11px] leading-tight mt-1 text-white/85 line-clamp-2">{s.name}</div>
                <div className="font-head text-xs" style={{ color: s.rarityColor }}>{money(s.price)}</div>
              </button>
            ))}
          </div>
        </section>
      </main>

      {flash && (
        <div className="fixed inset-0 z-30 grid place-items-center bg-void/80 p-4" onClick={() => setFlash(null)}>
          <div className="clip-panel bg-steel border p-8 text-center max-w-sm w-full pop-in"
            style={{ borderColor: flash.win ? '#43d17c' : '#eb4b4b', boxShadow:`0 0 70px -22px ${flash.win ? '#43d17c' : '#eb4b4b'}` }}
            onClick={(e) => e.stopPropagation()}>
            <div className="font-head text-3xl" style={{ color: flash.win ? '#43d17c' : '#eb4b4b' }}>{flash.win ? 'Апгрейд прошёл' : 'Скин сгорел'}</div>
            <div className="my-5 grid place-items-center"><SkinArt skin={flash.win ? flash.to : flash.from} size={200} /></div>
            <p className="text-sm text-white/90">{flash.win ? flash.to.name : flash.from.name}</p>
            <p className="text-xs text-ash mt-1">{flash.win ? `Добавлен в инвентарь · ${money(flash.to.price)}` : `Потеряно ${money(flash.from.price)}`}</p>
            <button onClick={() => setFlash(null)} className="clip-btn mt-6 w-full py-3 font-head bg-sand text-void hover:brightness-110 transition">Дальше</button>
          </div>
        </div>
      )}

      {picker === 'src' && (
        <Picker title="Что отправляем в апгрейд" hint="Только скины из инвентаря" showFilters={false}
          items={invSkins} currentId={srcId}
          onSelect={(id) => { setSrcId(id); setResult(null); setPicker(null); }} onClose={() => setPicker(null)} />
      )}
      {picker === 'dst' && (
        <Picker title="Что хотим получить" hint="Весь каталог, фильтр по типу оружия" showFilters
          items={targets} currentId={dstId}
          onSelect={(id) => { setDstId(id); setResult(null); setPicker(null); }} onClose={() => setPicker(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
